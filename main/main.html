<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshVeggies - Main</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            padding: 50px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 42px;
            color: #228b22;
            margin-bottom: 10px;
        }

        .subtitle {
            font-size: 18px;
            color: #666;
            margin-bottom: 35px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60px;
            padding: 15px 20px;
            border-radius: 12px;
            text-decoration: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.25s ease;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.2);
        }

        .cart {
            background: #ff6b6b;
        }

        .checkout {
            background: #ff9f43;
        }

        .signup {
            background: #1dd1a1;
        }

        .login {
            background: #54a0ff;
        }

        .home {
            background: #5f27cd;
            grid-column: 1 / -1;
        }

        .footer {
            margin-top: 30px;
            font-size: 14px;
            color: #777;
        }

        @media (max-width: 600px) {
            .container {
                padding: 35px 20px;
            }

            h1 {
                font-size: 32px;
            }

            .buttons {
                grid-template-columns: 1fr;
            }

            .home {
                grid-column: auto;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">🥕</div>

        <h1>FreshVeggies</h1>

        <p class="subtitle">
            Fresh vegetables delivered to your doorstep
        </p>

        <div class="buttons">

            <!-- Cart -->
            <a href="/cart" class="btn cart">
                🛒 Cart
            </a>

            <!-- Checkout -->
            <a href="/checkout" class="btn checkout">
                💳 Checkout
            </a>

            <!-- Signup -->
            <a href="/signup" class="btn signup">
                📝 Signup
            </a>

            <!-- Login -->
            <a href="/login" class="btn login">
                🔐 Login
            </a>

            <!-- Home -->
            <a href="/home" class="btn home">
                🏠 Home
            </a>

        </div>

        <div class="footer">
            Fresh • Healthy • Delivered
        </div>

    </div>

</body>
</html>
