<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FreshVeggies - Home</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #d4fc79, #96e6a1);
        }

        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 700px;
        }

        h1 {
            color: #228b22;
            font-size: 42px;
            margin-bottom: 10px;
        }

        p {
            color: #555;
            font-size: 18px;
            margin-bottom: 35px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .btn {
            text-decoration: none;
            padding: 18px 25px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
            display: block;
        }

        .btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.2);
        }

        .cart {
            background: #ff6b6b;
        }

        .checkout {
            background: #ff9f43;
        }

        .signup {
            background: #1dd1a1;
        }

        .login {
            background: #54a0ff;
        }

        .home {
            background: #5f27cd;
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .buttons {
                grid-template-columns: 1fr;
            }

            .home {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🥕 FreshVeggies</h1>

        <p>Fresh vegetables delivered to your doorstep</p>

        <div class="buttons">

            <a href="/cart" class="btn cart">
                🛒 Cart
            </a>

            <a href="/checkout" class="btn checkout">
                💳 Checkout
            </a>

            <a href="/signup" class="btn signup">
                📝 Signup
            </a>

            <a href="/login" class="btn login">
                🔐 Login
            </a>

            <a href="/" class="btn home">
                🏠 Home
            </a>

        </div>

    </div>

</body>
</html>
