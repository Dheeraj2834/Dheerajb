apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: 827566277160.dkr.ecr.us-east-1.amazonaws.com/checkout:latest
          ports:
            - containerPort: 80